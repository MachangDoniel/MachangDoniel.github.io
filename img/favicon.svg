<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dtGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#dtGrad)"/>
  <!-- Inner Border for tab contrast -->
  <rect x="18" y="18" width="476" height="476" rx="108" ry="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>
  <!-- DT Monogram Text -->
  <text x="256" y="340" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', system-ui, sans-serif" 
        font-size="240" 
        font-weight="900" 
        letter-spacing="-4px" 
        fill="#ffffff"
        filter="url(#shadow)">DT</text>
</svg>
